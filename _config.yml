title: Dhruva
email: keenignition@gmail.com
description: >-
  Internet taught. World models are awesome.
baseurl: ""
url: "https://elrenadax.github.io"
github_username: elrenadax
kaggle_username: elrensmin
markdown: kramdown
plugins:
  - jekyll-feed
  - jekyll-seo-tag

collections:
  writing:
    output: true
    permalink: /o/:title/

defaults:
  - scope:
      path: ""
      type: "writing"
    values:
      layout: log
  - scope:
      path: ""
    values:
      layout: page

include:
  - .well-known

exclude:
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/
  - .github/
