<header class="site-header">
  <div class="wrapper">
    <div class="site-header-inner">
      <a class="site-brand" href="{{ '/' | relative_url }}" aria-label="{{ site.title }} home">
        <picture>
          <source srcset="{{ '/images/site-mark.webp' | relative_url }}" type="image/webp">
          <img class="site-mark" src="{{ '/images/site-mark.jpg' | relative_url }}" alt="" width="36" height="36" decoding="async" fetchpriority="high">
        </picture>
        <span class="site-name">{{ site.title }}</span>
      </a>

<nav class="site-nav" aria-label="Main">
        <a href="{{ '/input/' | relative_url }}" aria-label="input" title="input"{% if page.url contains '/input/' %} aria-current="page"{% endif %}>I</a>
        <span class="nav-sep" aria-hidden="true">/</span>
        <a href="{{ '/media/' | relative_url }}" aria-label="media" title="media"{% if page.url contains '/media/' %} aria-current="page"{% endif %}>M</a>
        <span class="nav-sep" aria-hidden="true">/</span>
        <a href="{{ '/output/' | relative_url }}" aria-label="output" title="output"{% if page.url contains '/output/' %} aria-current="page"{% endif %}>O</a>
      </nav>

      <button id="menu-toggle" class="menu-toggle" type="button" aria-label="Menu" aria-expanded="false" aria-controls="site-menu">
        <span aria-hidden="true">&#9776;</span>
      </button>

      <div id="site-menu" class="site-menu">


        <div class="site-actions">
          <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Switch to dark theme" title="Switch theme">
            <span class="theme-icon" aria-hidden="true">&#9790;</span>
          </button>

          {% if site.github_username %}
          <a class="icon-link icon-invert" href="https://github.com/{{ site.github_username }}" aria-label="GitHub" target="_blank" rel="noopener">
            <img src="{{ '/images/icons/github.webp' | relative_url }}" alt="" width="20" height="20" loading="lazy" decoding="async">
          </a>
          {% endif %}

          {% if site.kaggle_username %}
          <a class="icon-link icon-invert" href="https://www.kaggle.com/{{ site.kaggle_username }}" aria-label="Kaggle" target="_blank" rel="noopener">
            <img src="{{ '/images/icons/kaggle.webp' | relative_url }}" alt="" width="20" height="20" loading="lazy" decoding="async">
          </a>
          {% endif %}

        {% if site.kaggle_username %}
          <a class="icon-link icon-invert" href="https://www.youtube.com/@{{ site.youtube_username }}" aria-label="YouTube" target="_blank" rel="noopener">
            <img src="{{ '/images/icons/youtube.webp' | relative_url }}" alt="" width="20" height="20" loading="lazy" decoding="async">
          </a>
          {% endif %}
        </div>
      </div>
    </div>
  </div>
</header>
